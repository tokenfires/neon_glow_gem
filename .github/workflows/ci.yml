name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check out the matching demo styles
        uses: actions/checkout@v6
        with:
          repository: tokenfires/rails_neon_glow
          ref: 6b6e419f11104b7eb376802178ee9b7a5dfe9978
          path: reference
          persist-credentials: false
      - name: Verify stylesheet parity
        run: |
          diff reference/app/assets/stylesheets/neon_glow/tokens.css app/assets/stylesheets/neon_glow/tokens.css
          diff reference/app/assets/stylesheets/neon_glow/components.css app/assets/stylesheets/neon_glow/components.css
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Audit development dependencies
        run: bundle exec bundler-audit check --update
      - name: Test the built gem with Rails and Propshaft
        run: bundle exec rake test
